name: "Production Deployment"
on:
  push:
    branches: [ main ]
    paths:
      - "**.tf"
      - "lambda/**"
      - ".github/workflows/cd.yml"
      - 'scripts/**'
  workflow_dispatch:

jobs:
  # Detect what changed
  detect-changes:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      has_state: ${{ steps.check-state.outputs.has_state }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - '**.tf'
              - 'lambda/**'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # Check if there is anything actually deployed in Terraform Cloud
      - name: Check Terraform State
        id: check-state
        run: |
          terraform init
          # If 'state list' is empty, it returns nothing
          if [ -z "$(terraform state list)" ]; then
            echo "has_state=false" >> $GITHUB_OUTPUT
          else
            echo "has_state=true" >> $GITHUB_OUTPUT
          fi
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

  # Wait for Terraform Cloud to complete the VCS-triggered run
  terraform-cloud-wait:
    needs: detect-changes
    # ONLY run this if the 'infra' filter found changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Wait for TFC Apply
        uses: binxio/tfe-run-wait-action@main
        with:
          action: wait
          token: ${{ secrets.TF_API_TOKEN }}
          organization: "my-terraform-aws-projects-2025"
          workspace: "AWS-lex-translator" # Update this to match your TFC workspace name
          clone_url: ${{ github.server_url }}/${{ github.repository }}.git
          commit_sha: ${{ github.sha }}
          branch: "main"

  # Post-Deployment Verification
  post-deploy:
    # This runs if TFC-wait was successful OR if it was skipped
    needs: [detect-changes, terraform-cloud-wait]
    if: |
      always() && !cancelled() &&
      (needs.terraform-cloud-wait.result == 'success' || needs.terraform-cloud-wait.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Fetch Environment Variables
        id: vars
        run: echo "AWS_REGION=$(terraform output -raw aws_region)" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::871308866502:role/GitHubActionRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Test Translation Logic (Integration Test)
        run: |
          # Use the AWS CLI to invoke the Lambda directly with a Lex-formatted payload
          # or use a script to test the Lex Bot alias if the Bot is also managed by IaC
          aws lambda invoke \
            --function-name $(terraform output -raw lambda_function_name) \
            --payload '{"sessionState": {"intent": {"name": "TranslateIntent", "slots": {"phrase": {"value": {"interpretedValue": "Hello"}}, "target_language": {"value": {"interpretedValue": "French"}}}}}}' \
            response.json

          # Check if the translation "Bonjour" exists in the response
          grep -q "Bonjour" response.json

      - name: Verify Lex-Lambda Permission
        run: |
          POLICY=$(aws lambda get-policy --function-name LexTranslationHandler --query 'Policy' --output text)
          if echo "$POLICY" | grep -q "lexv2.amazonaws.com"; then
            echo "Permission verified: Lex is authorized to invoke Lambda."
          else
            echo "Error: Lex permission missing from Lambda policy!"
            exit 1
          fi
