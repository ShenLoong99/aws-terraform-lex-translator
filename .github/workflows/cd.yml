name: "Production Deployment"
on:
  push:
    branches: [ main ]
    paths:
      - "**.tf"
      - "lambda/**"
      - "scripts/**"
      - "website-files/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

jobs:
  # Detect what changed to optimize the run
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - '**.tf'
              - 'lambda/**'
            app:
              - 'website-files/**'
              - '.github/workflows/cd.yml'

  # Infrastructure Job (Terraform)
  terraform:
    needs: changes
    # Only run if .tf files or lambda code changed
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

  # Deployment & Health Check (Frontend & Testing)
  deploy:
    needs: [changes, terraform]
    # Run if the app (frontend) changed OR the infra job finished successfully
    if: |
      always() &&
      (needs.changes.outputs.app == 'true' || needs.terraform.result == 'success')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3
      #   with:
      #     cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      #     terraform_wrapper: false

      # - name: Terraform Init
      #   run: terraform init

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::871308866502:role/GitHubActionRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Translation Logic (Integration Test)
        run: |
          # Use the AWS CLI to invoke the Lambda directly with a Lex-formatted payload
          # or use a script to test the Lex Bot alias if the Bot is also managed by IaC
          aws lambda invoke \
            --function-name $(terraform output -raw lambda_function_name) \
            --payload '{"sessionState": {"intent": {"name": "TranslateIntent", "slots": {"phrase": {"value": {"interpretedValue": "Hello"}}, "target_language": {"value": {"interpretedValue": "French"}}}}}}' \
            response.json

          # Check if the translation "Bonjour" exists in the response
          grep -q "Bonjour" response.json

      - name: Verify Lex-Lambda Permission
        run: |
          POLICY=$(aws lambda get-policy --function-name LexTranslationHandler --query 'Policy' --output text)
          if echo "$POLICY" | grep -q "lexv2.amazonaws.com"; then
            echo "Permission verified: Lex is authorized to invoke Lambda."
          else
            echo "Error: Lex permission missing from Lambda policy!"
            exit 1
          fi
